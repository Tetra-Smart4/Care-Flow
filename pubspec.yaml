name: careflow_patient

description: CareFlow patient app - Flutter + Supabase

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  intl: ^0.19.0

  # QR code generation
  qr_flutter: ^4.1.0

  # QR/barcode scanning
  mobile_scanner: ^7.4.2
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
